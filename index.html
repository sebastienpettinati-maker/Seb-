<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3e2415">
<title>Évaluation TP — Session 1</title>
<style>
  :root{
    --fond:#f6f1e8; --carte:#ffffff; --encre:#2b2016; --encre-2:#8a7860;
    --choco:#3e2415; --choco-2:#5d3a22; --caramel:#c98a3d; --caramel-clair:#f3e3cc;
    --bord:#eadfce;
    --na:#d94f3d; --eca:#ee9832; --a:#3a8fd9; --m:#38b26a;
    --na-fond:#fdeeec; --eca-fond:#fef3e4; --a-fond:#eaf3fc; --m-fond:#e9f8f0;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--fond); color:var(--encre); font-size:16px; line-height:1.45;
  }
  button{font-family:inherit;}

  /* ============ EN-TÊTE ============ */
  .entete{
    background:linear-gradient(135deg,#3e2415 0%,#5d3a22 60%,#7a4a28 100%);
    color:#fff; padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
    border-radius:0 0 26px 26px; box-shadow:0 6px 18px rgba(62,36,21,.25);
    position:relative; z-index:20;
  }
  .entete .ligne{display:flex; align-items:center; gap:12px;}
  .entete h1{margin:0; font-size:18px; font-weight:800; flex:1; line-height:1.25; letter-spacing:.2px;}
  .entete h1 small{display:block; font-weight:500; font-size:12px; opacity:.75; margin-top:2px;}
  .b-retour{
    background:rgba(255,255,255,.14); border:none; color:#fff; font-size:15px; font-weight:700;
    border-radius:12px; padding:10px 13px; cursor:pointer;
  }
  /* anneau de progression */
  .anneau{position:relative; width:56px; height:56px; flex-shrink:0;}
  .anneau svg{transform:rotate(-90deg);}
  .anneau .fond{stroke:rgba(255,255,255,.18); fill:none; stroke-width:5;}
  .anneau .val{stroke:#ffd28a; fill:none; stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .3s;}
  .anneau .centre{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:#ffd28a;
  }

  /* ============ ÉTAPES ============ */
  .etapes{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 6px; scrollbar-width:none;
    max-width:680px; margin:0 auto;
  }
  .etapes::-webkit-scrollbar{display:none;}
  .etape{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    background:var(--carte); border:1.5px solid var(--bord); color:var(--encre-2);
    border-radius:22px; padding:9px 14px; font-size:13.5px; font-weight:700; cursor:pointer;
    white-space:nowrap; transition:all .15s;
  }
  .etape.actif{background:var(--choco); border-color:var(--choco); color:#fff;}
  .etape .fait{
    width:18px; height:18px; border-radius:50%; background:var(--m); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px;
  }
  .etape .reste{
    min-width:18px; height:18px; border-radius:9px; background:var(--caramel-clair); color:var(--choco-2);
    display:flex; align-items:center; justify-content:center; font-size:11px; padding:0 5px;
  }
  .etape.actif .reste{background:rgba(255,255,255,.2); color:#fff;}

  main{max-width:680px; margin:0 auto; padding:10px 16px 120px;}

  /* ============ CARTES / LISTE ============ */
  .carte{
    background:var(--carte); border:1px solid var(--bord); border-radius:var(--r);
    box-shadow:0 2px 10px rgba(62,36,21,.06); padding:16px; margin-bottom:12px;
  }
  .carte-eval{display:flex; align-items:center; gap:13px; cursor:pointer;}
  .carte-eval .avatar{
    width:46px; height:46px; border-radius:14px; background:var(--caramel-clair);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .carte-eval .infos{flex:1; min-width:0;}
  .carte-eval .nom{font-weight:800; font-size:16px;}
  .carte-eval .meta{color:var(--encre-2); font-size:13px; margin-top:2px;}
  .badge-note{
    padding:7px 11px; border-radius:12px; font-weight:800; font-size:15px; color:#fff; flex-shrink:0;
    text-align:center; min-width:56px;
  }
  .badge-note small{display:block; font-size:9px; font-weight:600; opacity:.85;}
  .b-mini{
    width:38px; height:38px; border:none; border-radius:12px; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .vide{text-align:center; color:var(--encre-2); padding:52px 20px;}
  .vide .picto{font-size:52px; margin-bottom:12px;}
  .stats-bandeau{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;
  }
  .stat{
    background:var(--carte); border:1px solid var(--bord); border-radius:var(--r);
    padding:12px 8px; text-align:center;
  }
  .stat .val{font-size:22px; font-weight:800; color:var(--choco);}
  .stat .lib{font-size:11px; color:var(--encre-2); font-weight:600; margin-top:2px;}

  /* ============ FORMULAIRE ============ */
  .panneau{display:none;}
  .panneau.actif{display:block; animation:app .18s ease;}
  @keyframes app{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .titre-panneau{
    display:flex; align-items:center; gap:10px; margin:10px 2px 12px; font-size:16px; font-weight:800;
  }
  .titre-panneau .pico{
    width:40px; height:40px; border-radius:13px; background:var(--caramel-clair);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .titre-panneau small{display:block; font-weight:500; font-size:12px; color:var(--encre-2);}

  label.champ{display:block; font-size:13px; font-weight:700; color:var(--encre-2); margin:14px 0 5px;}
  label.champ:first-child{margin-top:0;}
  input[type=text],input[type=date],input[type=number],textarea{
    width:100%; border:1.5px solid var(--bord); border-radius:13px; padding:12px 13px;
    font-size:16px; font-family:inherit; background:#fffdf9; color:var(--encre);
  }
  textarea{resize:vertical; min-height:66px;}
  input:focus,textarea:focus{outline:none; border-color:var(--caramel); box-shadow:0 0 0 3px rgba(201,138,61,.18);}
  .jours{display:flex; gap:10px;}
  .puce-jour{
    flex:1; text-align:center; border:1.5px solid var(--bord); border-radius:13px;
    padding:12px 6px; font-size:15px; font-weight:700; cursor:pointer; background:#fffdf9; color:var(--encre-2);
    user-select:none;
  }
  .puce-jour.actif{background:var(--caramel); border-color:var(--caramel); color:#fff;}

  /* critère */
  .critere{padding:16px; margin-bottom:12px;}
  .critere .haut{display:flex; align-items:flex-start; gap:8px;}
  .critere .num{
    background:var(--caramel-clair); color:var(--choco-2); font-size:11px; font-weight:800;
    border-radius:8px; padding:3px 7px; margin-top:2px; flex-shrink:0;
  }
  .critere .titre{font-weight:800; font-size:15.5px; flex:1;}
  .critere .indicateur{color:var(--encre-2); font-size:13px; margin:6px 0 12px;}
  .notes{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .note-btn{
    border:1.5px solid var(--bord); background:#fffdf9; border-radius:14px;
    padding:9px 2px 8px; font-weight:800; font-size:12px; cursor:pointer; color:var(--encre-2);
    display:flex; flex-direction:column; align-items:center; gap:3px; line-height:1.1;
    transition:transform .07s;
  }
  .note-btn .ico{font-size:23px; filter:grayscale(1); opacity:.45; transition:.12s;}
  .note-btn:active{transform:scale(.93);}
  .note-btn.sel-na{background:var(--na-fond); border-color:var(--na); color:var(--na);}
  .note-btn.sel-eca{background:var(--eca-fond); border-color:var(--eca); color:var(--eca);}
  .note-btn.sel-a{background:var(--a-fond); border-color:var(--a); color:var(--a);}
  .note-btn.sel-m{background:var(--m-fond); border-color:var(--m); color:var(--m);}
  .note-btn[class*=sel-] .ico{filter:none; opacity:1;}
  .obs-toggle{
    background:none; border:none; color:var(--caramel); font-size:13px; font-weight:700;
    padding:10px 0 0; cursor:pointer;
  }
  .critere textarea{margin-top:9px; min-height:54px; font-size:14px;}

  /* navigation bas de panneau */
  .nav-panneau{display:flex; gap:10px; margin-top:6px;}
  .b-nav{
    flex:1; border:1.5px solid var(--bord); background:var(--carte); color:var(--choco-2);
    border-radius:14px; padding:13px; font-size:15px; font-weight:800; cursor:pointer;
  }
  .b-nav.suivant{background:var(--choco); border-color:var(--choco); color:#fff;}

  /* synthèse */
  .cercle-note{
    width:130px; height:130px; margin:6px auto 4px; position:relative;
  }
  .cercle-note svg{transform:rotate(-90deg);}
  .cercle-note .fond{stroke:var(--bord); fill:none; stroke-width:9;}
  .cercle-note .val{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .4s, stroke .3s;}
  .cercle-note .centre{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .cercle-note .chiffre{font-size:32px; font-weight:800; line-height:1;}
  .cercle-note .sur{font-size:12px; color:var(--encre-2); font-weight:600;}
  .detail-calcul{text-align:center; font-size:12.5px; color:var(--encre-2); margin-bottom:12px;}
  .ajuste{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px;}
  .ajuste input{width:92px; text-align:center; font-weight:800;}
  .b-auto{border:1.5px solid var(--bord); background:#fffdf9; color:var(--encre-2); border-radius:12px; padding:10px 14px; font-weight:700; cursor:pointer;}
  .niveaux{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .niveau-btn{
    border:1.5px solid var(--bord); background:#fffdf9; border-radius:13px; padding:11px 6px;
    font-size:13.5px; font-weight:700; cursor:pointer; color:var(--encre-2);
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .niveau-btn .ico{font-size:18px; filter:grayscale(1); opacity:.5;}
  .niveau-btn.actif{background:var(--choco); border-color:var(--choco); color:#fff;}
  .niveau-btn.actif .ico{filter:none; opacity:1;}
  .recap-sections{margin:4px 0 0;}
  .recap-ligne{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--bord); font-size:13.5px;}
  .recap-ligne:first-child{border-top:none;}
  .recap-ligne .rico{font-size:17px;}
  .recap-ligne .rtitre{flex:1; font-weight:600; color:var(--encre); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .recap-ligne .retat{font-weight:800; font-size:12.5px; color:var(--encre-2);}

  /* barre d'action */
  .barre{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--bord);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .barre .int{display:flex; gap:10px; max-width:680px; margin:0 auto;}
  .b-principal{
    flex:2; background:var(--choco); color:#fff; border:none; border-radius:15px;
    padding:15px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(62,36,21,.28);
  }
  .b-second{
    flex:1; background:#fff; color:var(--choco-2); border:1.5px solid var(--bord); border-radius:15px;
    padding:15px 6px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .b-flottant{
    position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--choco); color:#fff; border:none; border-radius:30px;
    padding:16px 28px; font-size:16px; font-weight:800; box-shadow:0 6px 18px rgba(62,36,21,.4);
    cursor:pointer; z-index:40;
  }

  .toast{
    position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--encre); color:#fff; padding:12px 22px; border-radius:26px; font-size:14px;
    z-index:100; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; font-weight:600;
  }
  .toast.visible{opacity:1;}

  /* ============ RÉGLAGES / SYNCHRO ============ */
  .etat-sync{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:13px;
    font-size:14px; font-weight:700; margin-bottom:12px;
  }
  .etat-sync.ok{background:var(--m-fond); color:var(--m);}
  .etat-sync.off{background:#f3efe8; color:var(--encre-2);}
  .etat-sync.attente{background:var(--eca-fond); color:var(--eca);}
  .guide{counter-reset:etp; font-size:14px;}
  .guide .pas{display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--bord); align-items:flex-start;}
  .guide .pas:first-child{border-top:none;}
  .guide .pas::before{
    counter-increment:etp; content:counter(etp);
    width:24px; height:24px; flex-shrink:0; border-radius:50%; background:var(--caramel-clair);
    color:var(--choco-2); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .guide code{background:#f3efe8; border-radius:6px; padding:1px 6px; font-size:12.5px; word-break:break-all;}
  .bloc-code{
    background:#2b2016; color:#e8ddc8; border-radius:13px; padding:12px; font-size:11px;
    font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre; overflow-x:auto;
    max-height:220px; overflow-y:auto; margin-top:10px;
  }
  .b-bloc{
    width:100%; margin-top:10px; border:1.5px solid var(--bord); background:#fffdf9; color:var(--choco-2);
    border-radius:13px; padding:12px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .b-bloc.plein{background:var(--choco); border-color:var(--choco); color:#fff;}

  /* ============ IMPRESSION ============ */
  #vue-impression{display:none;}
  @media print{
    body *{visibility:hidden;}
    #vue-impression,#vue-impression *{visibility:visible;}
    #vue-impression{display:block; position:absolute; top:0; left:0; width:100%; font-size:11px; color:#000; padding:6mm;}
    #vue-impression h2{font-size:15px; margin:0 0 2px;}
    #vue-impression h3{font-size:12px; margin:10px 0 4px; background:#eee; padding:4px 6px;}
    #vue-impression table{width:100%; border-collapse:collapse; margin-bottom:4px;}
    #vue-impression th,#vue-impression td{border:1px solid #999; padding:3px 5px; text-align:left; vertical-align:top;}
    #vue-impression th{background:#f2f2f2;}
    #vue-impression .centre{text-align:center; width:34px;}
    #vue-impression .sig{display:flex; gap:20px; margin-top:16px;}
    #vue-impression .sig div{flex:1; border:1px solid #999; height:56px; padding:4px; font-size:10px;}
  }
</style>
</head>
<body>

<div class="entete">
  <div class="ligne">
    <button class="b-retour" id="btn-retour" style="display:none" onclick="app.retourListe()">‹</button>
    <h1 id="titre-header">Évaluation TP<small>Session 1 — Rentrée &amp; Fondamentaux · BTM Pâtissier</small></h1>
    <div class="anneau" id="anneau" style="display:none">
      <svg width="56" height="56"><circle class="fond" cx="28" cy="28" r="24"/><circle class="val" id="anneau-val" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg>
      <div class="centre" id="anneau-txt">0%</div>
    </div>
  </div>
</div>

<div class="etapes" id="etapes" style="display:none"></div>

<main id="contenu"></main>

<button class="b-flottant" id="btn-nouveau" onclick="app.nouvelle()">＋ Nouvelle évaluation</button>

<div class="barre" id="barre-form" style="display:none"><div class="int">
  <button class="b-second" onclick="app.imprimer()">🖨 PDF</button>
  <button class="b-second" onclick="app.partager()">📤</button>
  <button class="b-principal" onclick="app.sauvegarder(true)">💾 Enregistrer</button>
</div></div>

<div class="toast" id="toast"></div>
<div id="vue-impression"></div>

<script>
/* ================== GRILLE ================== */
const GRILLE = {
  titre: "SESSION 1 — SEPTEMBRE — ANNÉE 1",
  sousTitre: "Grille d'évaluation — TP « Rentrée & Fondamentaux »",
  reference: "BTM Pâtissier-Glacier-Chocolatier-Confiseur-Traiteur (RNCP 41998) — Domaine Professionnel, Bloc BC01/BC04",
  sections: [
    { id:"s1", ico:"🧼", court:"Hygiène", titre:"Journée 1 — Hygiène, sécurité alimentaire & organisation (diagnostique)",
      criteres:[
        {id:"c1", titre:"Tenue professionnelle & hygiène", ind:"Tenue complète et propre, mains lavées/désinfectées, ongles courts, bijoux retirés"},
        {id:"c2", titre:"Marche en avant", ind:"Identifie et respecte les zones du laboratoire (réception, stockage, préparation, cuisson, finition)"},
        {id:"c3", titre:"Principes HACCP", ind:"Cite les grands principes (identification des dangers, points critiques, traçabilité) à l'oral"},
        {id:"c4", titre:"DLC / DLUO", ind:"Distingue correctement une DLC d'une DLUO et leurs implications"},
        {id:"c5", titre:"Organisation du poste de travail", ind:"Poste rangé, propre, matériel nettoyé avant/après utilisation (méthode 5S)"}
      ]},
    { id:"s2", ico:"🥐", court:"Pâtes", titre:"Journée 1 — Techniques de base : pâtes (sablée, brisée, feuilletée rapide)",
      criteres:[
        {id:"c6", titre:"Pâte sablée — pesée & dosage", ind:"Respect des grammages de la fiche technique, pesée précise"},
        {id:"c7", titre:"Pâte sablée — texture", ind:"Pâte non travaillée, homogène, sans excès d'élasticité"},
        {id:"c8", titre:"Pâte brisée — sablage", ind:"Beurre resté froid, éclats visibles, sablage rapide et régulier"},
        {id:"c9", titre:"Pâte feuilletée rapide — tours", ind:"Tours réalisés correctement, repos respectés, pâte striée de beurre visible"},
        {id:"c10", titre:"Gestion du temps", ind:"Respect du minutage de la séquence après-midi (3h30)"}
      ]},
    { id:"s3", ico:"🥧", court:"Tarte & Cie", titre:"Journée 2 — Mise en œuvre : tarte, crumble & clafoutis (formative)",
      criteres:[
        {id:"c11", titre:"Fonçage de tarte", ind:"Épaisseur régulière (3 mm), pas de trous ni de surépaisseurs, bords nets"},
        {id:"c12", titre:"Crème d'amande", ind:"Texture crémeuse, dosage respecté, application régulière sur le fond de tarte"},
        {id:"c13", titre:"Dressage des fruits (tarte)", ind:"Disposition régulière et esthétique (rosace / éventail), quantité homogène"},
        {id:"c14", titre:"Cuisson de la tarte", ind:"Coloration dorée homogène, cuisson à cœur de la crème d'amande"},
        {id:"c15", titre:"Pâte à crumble", ind:"Texture grumeleuse irrégulière, non tassée, non travaillée en pâte homogène"},
        {id:"c16", titre:"Cuisson du crumble", ind:"Coloration dorée, croustillant obtenu, fruits fondants à cœur"},
        {id:"c17", titre:"Appareil à clafoutis", ind:"Appareil lisse, sans grumeaux, bien délayé"},
        {id:"c18", titre:"Cuisson du clafoutis", ind:"Prise correcte, encore légèrement tremblotant au centre à la sortie du four"}
      ]},
    { id:"s4", ico:"🤝", court:"Savoir-être", titre:"Savoir-être professionnel (transversal aux 2 journées)",
      criteres:[
        {id:"c19", titre:"Autonomie", ind:"Réalise les tâches sans sollicitation excessive du formateur"},
        {id:"c20", titre:"Respect des consignes et du temps", ind:"Suit la fiche technique et le minutage donné"},
        {id:"c21", titre:"Communication / travail en équipe", ind:"Échange de façon professionnelle avec les autres apprenants et le formateur"},
        {id:"c22", titre:"Nettoyage et rangement en fin de séance", ind:"Poste, matériel et laboratoire remis en état conforme"}
      ]}
  ]
};
const NIVEAUX = ["NA","ECA","A","M"];
const NIVEAUX_LONG = {NA:"Non acquis", ECA:"En cours d'acquisition", A:"Acquis", M:"Maîtrisé"};
const NIVEAUX_ICO = {NA:"❌", ECA:"⏳", A:"✅", M:"⭐"};
const POINTS = {NA:0, ECA:1, A:2, M:3};
const TOUS_CRITERES = GRILLE.sections.flatMap(s=>s.criteres);
const CLE_STOCKAGE = "evaluations_tp_session1";
const CLE_SYNC_URL = "sync_url_tp";
const CLE_ATTENTE = "sync_attente_tp";

/* Script à coller dans Google Apps Script (Extensions › Apps Script de la feuille Google) */
const APPS_SCRIPT_CODE = `const NOM_FEUILLE = "Évaluations";

function doGet() { return reponse({ ok: true }); }

function doPost(e) {
  const verrou = LockService.getScriptLock();
  verrou.waitLock(15000);
  try {
    const d = JSON.parse(e.postData.contents);
    const f = feuille();
    if (d.action === "delete") {
      const r = trouverLigne(f, d.id);
      if (r > 0) f.deleteRow(r);
      return reponse({ ok: true });
    }
    const entetes = assurerEntetes(f, Object.keys(d.ligne));
    const valeurs = entetes.map(function (h) {
      return d.ligne[h] !== undefined ? d.ligne[h] : "";
    });
    const r = trouverLigne(f, d.ligne["ID"]);
    if (r > 0) f.getRange(r, 1, 1, valeurs.length).setValues([valeurs]);
    else f.appendRow(valeurs);
    return reponse({ ok: true });
  } catch (err) {
    return reponse({ ok: false, erreur: String(err) });
  } finally {
    verrou.releaseLock();
  }
}

function feuille() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let f = ss.getSheetByName(NOM_FEUILLE);
  if (!f) f = ss.insertSheet(NOM_FEUILLE);
  return f;
}

function assurerEntetes(f, cles) {
  if (f.getLastRow() === 0) {
    f.appendRow(cles);
    f.setFrozenRows(1);
    return cles;
  }
  let entetes = f.getRange(1, 1, 1, f.getLastColumn() || 1).getValues()[0].filter(String);
  const manquantes = cles.filter(function (c) { return entetes.indexOf(c) < 0; });
  if (manquantes.length) {
    f.getRange(1, entetes.length + 1, 1, manquantes.length).setValues([manquantes]);
    entetes = entetes.concat(manquantes);
  }
  return entetes;
}

function trouverLigne(f, id) {
  if (f.getLastRow() < 2) return -1;
  const ids = f.getRange(2, 1, f.getLastRow() - 1, 1).getValues();
  for (let i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2;
  }
  return -1;
}

function reponse(o) {
  return ContentService.createTextOutput(JSON.stringify(o))
    .setMimeType(ContentService.MimeType.JSON);

    this._vidage=true;

      while(attente.length){
        const t=attente[0];
        let ok;
        if(t.type==="delete") ok=await this.envoyer({action:"delete",id:t.id});
        else{
          const e=this.charger().find(x=>x.id===t.id);
          ok=e?await this.envoyer({action:"upsert",ligne:this.lignePourFeuille(e)}):true;
        }
        if(!ok) break;
        attente=this.fileAttente().filter(x=>!(x.type===t.type&&x.id===t.id));
        this.persisterAttente(attente);
      }
    }finally{ this._vidage=false; }

  noter(cid,niveau,btn){
    const e=this.courante;
    if(e.notes[cid]===niveau) delete e.notes[cid]; else e.notes[cid]=niveau;
    const sel=e.notes[cid];
    [...btn.parentNode.children].forEach((b,i)=>{
      b.className="note-btn"+(sel===NIVEAUX[i]?" sel-"+NIVEAUX[i].toLowerCase():"");
    });
    this.majProgression();
  },
  toggleObs(cid){
    const ta=document.getElementById("obs-"+cid);
    const v=ta.style.display!=="none";
    ta.style.display=v?"none":"block";
    if(!v) ta.focus();
  },
  majObs(cid,val){ if(val) this.courante.obs[cid]=val; else delete this.courante.obs[cid]; },
  majNoteManuelle(val){
    this.courante.noteManuelle=val===""?null:Math.max(0,Math.min(20,Number(val)));
    this.majSynthese();
  },
  majNiveau(n,btn){
    this.courante.niveauGlobal=this.courante.niveauGlobal===n?"":n;
    [...btn.parentNode.children].forEach((b,i)=>b.classList.toggle("actif",this.courante.niveauGlobal===NIVEAUX[i]));
  },

  majProgression(){
    const e=this.courante; if(!e) return;
    const c=this.calcul(e);
    const pct=c.total?c.nb/c.total:0;
    const circ=150.8;
    document.getElementById("anneau-val").style.strokeDashoffset=circ*(1-pct);
    document.getElementById("anneau-txt").textContent=Math.round(pct*100)+"%";
    // badges d'étapes
    for(const s of GRILLE.sections){
      const cs=this.calculSection(e,s);
      const b=document.getElementById("badge-"+s.id);
      if(b) b.outerHTML = cs.nb===cs.total
        ? `<span class="fait" id="badge-${s.id}">✓</span>`
        : `<span class="reste" id="badge-${s.id}">${cs.nb}/${cs.total}</span>`;
    }
    const bi=document.getElementById("badge-infos");
    if(bi) bi.outerHTML = e.apprenti
      ? `<span class="fait" id="badge-infos">✓</span>`
      : `<span class="reste" id="badge-infos">…</span>`;
    const bs=document.getElementById("badge-syn");
    if(bs) bs.outerHTML=`<span class="et-badge" id="badge-syn"></span>`;
  },

  majSynthese(){
    const e=this.courante; if(!e) return;
    const c=this.calcul(e), note=this.noteFinale(e);
    const elN=document.getElementById("syn-note");
    if(!elN) return;
    elN.textContent=note===null?"—":String(note).replace(".",",");
    elN.style.color=this.couleurNote(note);
    const cercle=document.getElementById("cercle-val");
    const circ=358.1;
    cercle.style.stroke=this.couleurNote(note);
    cercle.style.strokeDashoffset=note===null?circ:circ*(1-note/20);
    let t;
    if(c.nb===0) t="Notez des critères pour un calcul automatique (❌ 0 pt · ⏳ 1 pt · ✅ 2 pts · ⭐ 3 pts).";
    else{
      t=`Calcul auto : ${c.pts}/${c.max} pts sur ${c.nb} critère${c.nb>1?"s":""} → ${String(c.note).replace(".",",")}/20`;
      if(e.noteManuelle!==null&&e.noteManuelle!=="") t+=" · note ajustée manuellement";
    }
    document.getElementById("syn-detail").textContent=t;
    const sugg=this.niveauSuggere(c.note);
    document.getElementById("lbl-niveau").innerHTML="Niveau global atteint"+(sugg?` <span style="font-weight:500">(suggestion : ${NIVEAUX_ICO[sugg]} ${NIVEAUX_LONG[sugg]})</span>`:"");
    const rec=document.getElementById("recap-sections");
    if(rec) rec.innerHTML=GRILLE.sections.map(s=>{
      const cs=this.calculSection(e,s);
      return `<div class="recap-ligne"><span class="rico">${s.ico}</span><span class="rtitre">${s.titre}</span>
        <span class="retat" style="color:${cs.nb===cs.total?"var(--m)":"var(--encre-2)"}">${cs.nb===cs.total?"✓ complet":cs.nb+"/"+cs.total}</span></div>`;
    }).join("");
    this.majProgression();
  },

  /* ---------- sauvegarde ---------- */
  sauvegarder(notifier){
    const e=this.courante; if(!e) return;
    if(e.formateur) localStorage.setItem("dernier_formateur",e.formateur);
    const l=this.charger();
    const i=l.findIndex(x=>x.id===e.id);
    if(i>=0) l[i]=JSON.parse(JSON.stringify(e)); else l.push(JSON.parse(JSON.stringify(e)));
    this.persister(l);
    if(notifier) this.toast(this.urlSync()?"💾 Enregistré · ☁️ envoi vers Google Sheets…":"💾 Évaluation enregistrée");
    this.planifier({type:"upsert",id:e.id});
  },

  /* ---------- exports ---------- */
  imprimer(){
    this.sauvegarder(false);
    document.getElementById("vue-impression").innerHTML=this.htmlImpression(this.courante);
    window.print();
  },
  htmlImpression(e){
    const c=this.calcul(e), note=this.noteFinale(e);
    let h=`<h2>${GRILLE.titre}</h2>
    <div><b>${GRILLE.sousTitre}</b></div>
    <div style="font-size:9px">${GRILLE.reference}</div>
    <table style="margin-top:6px"><tr>
      <th>Apprenti(e)</th><td>${this.echap(e.apprenti)}</td>
      <th>Date</th><td>${this.dateFr(e.date)}</td></tr>
    <tr><th>Formateur</th><td>${this.echap(e.formateur)}</td>
      <th>Journée(s)</th><td>${e.jours.j1?"☑":"☐"} Jour 1&nbsp;&nbsp;${e.jours.j2?"☑":"☐"} Jour 2</td></tr></table>
    <div style="font-size:9px;margin:4px 0">Légende — NA = Non acquis · ECA = En cours d'acquisition · A = Acquis · M = Maîtrisé</div>`;
    for(const s of GRILLE.sections){
      h+=`<h3>${s.titre}</h3><table><tr><th style="width:26%">Critère</th><th>Indicateurs</th>
        <th class="centre">NA</th><th class="centre">ECA</th><th class="centre">A</th><th class="centre">M</th><th style="width:20%">Observations</th></tr>`;
      for(const cr of s.criteres){
        const n=e.notes[cr.id]||"";
        h+=`<tr><td><b>${cr.titre}</b></td><td>${cr.ind}</td>`+
          NIVEAUX.map(x=>`<td class="centre">${n===x?"☑":"☐"}</td>`).join("")+
          `<td>${this.echap(e.obs[cr.id]||"")}</td></tr>`;
      }
      h+=`</table>`;
    }
    h+=`<h3>Synthèse de l'évaluation</h3>
    <table><tr><th style="width:30%">Note globale / 20</th><td><b style="font-size:14px">${note===null?"":String(note).replace(".",",")} / 20</b>
      ${c.nb?` <span style="font-size:9px">(${c.pts}/${c.max} pts, ${c.nb}/${c.total} critères)</span>`:""}</td></tr>
    <tr><th>Niveau global atteint</th><td>`+
      NIVEAUX.map(x=>`${e.niveauGlobal===x?"☑":"☐"} ${NIVEAUX_LONG[x]}`).join(" &nbsp; ")+
    `</td></tr>
    <tr><th>Appréciation générale<br>et axes de progrès</th><td style="height:44px">${this.echap(e.appreciation).replace(/\n/g,"<br>")}</td></tr></table>
    <div class="sig"><div>Signature du formateur</div><div>Signature de l'apprenti(e)</div></div>`;
    return h;
  },
  partager(){
    this.sauvegarder(false);
    const e=this.courante, note=this.noteFinale(e);
    let t=`${GRILLE.titre}\n${GRILLE.sousTitre}\n\nApprenti(e) : ${e.apprenti}\nFormateur : ${e.formateur}\nDate : ${this.dateFr(e.date)}\nJournée(s) : ${[e.jours.j1?"Jour 1":null,e.jours.j2?"Jour 2":null].filter(Boolean).join(" + ")||"—"}\n`;
    for(const s of GRILLE.sections){
      t+=`\n— ${s.titre} —\n`;
      for(const cr of s.criteres){
        t+=`• ${cr.titre} : ${e.notes[cr.id]?NIVEAUX_LONG[e.notes[cr.id]]:"non évalué"}`;
        if(e.obs[cr.id]) t+=` — ${e.obs[cr.id]}`;
        t+="\n";
      }
    }
    t+=`\nNOTE GLOBALE : ${note===null?"—":String(note).replace(".",",")}/20`;
    if(e.niveauGlobal) t+=`\nNiveau global : ${NIVEAUX_LONG[e.niveauGlobal]}`;
    if(e.appreciation) t+=`\n\nAppréciation : ${e.appreciation}`;
    if(navigator.share){ navigator.share({title:"Évaluation TP — "+e.apprenti, text:t}).catch(()=>{}); }
    else{ navigator.clipboard.writeText(t).then(()=>this.toast("📋 Copié dans le presse-papiers")); }
  },
  exportCSV(){
    const liste=this.charger();
    if(!liste.length){ this.toast("Aucune évaluation à exporter"); return; }
    const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const entetes=["Apprenti","Formateur","Date","Jour 1","Jour 2",
      ...TOUS_CRITERES.map(c=>c.titre), ...TOUS_CRITERES.map(c=>"Obs — "+c.titre),
      "Note /20","Niveau global","Appréciation"];
    const lignes=[entetes.map(esc).join(";")];
    for(const e of liste){
      const note=this.noteFinale(e);
      lignes.push([
        e.apprenti,e.formateur,e.date,e.jours.j1?"X":"",e.jours.j2?"X":"",
        ...TOUS_CRITERES.map(c=>e.notes[c.id]||""),
        ...TOUS_CRITERES.map(c=>e.obs[c.id]||""),
        note===null?"":String(note).replace(".",","), e.niveauGlobal?NIVEAUX_LONG[e.niveauGlobal]:"", e.appreciation
      ].map(esc).join(";"));
    }
    const blob=new Blob(["﻿"+lignes.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="evaluations_TP_session1.csv";
    a.click(); URL.revokeObjectURL(a.href);
    this.toast("⬇️ CSV téléchargé");
  },

  /* ---------- utilitaires ---------- */
  echap(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); },
  attr(s){ return this.echap(s).replace(/"/g,"&quot;"); },
  dateFr(d){ if(!d) return "—"; const [a,m,j]=d.split("-"); return j+"/"+m+"/"+a; },
  toast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg; t.classList.add("visible");
    clearTimeout(this._toastT);
    this._toastT=setTimeout(()=>t.classList.remove("visible"),2200);
  }
};

app.rendre();
app.viderAttente();
window.addEventListener("online",()=>app.viderAttente());
</script>
