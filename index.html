<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3f13">
<title>Évaluation TP — Session 1</title>
<style>
  :root{
    --brun:#7c3f13; --brun-fonce:#5c2e0d; --creme:#faf6f0; --carte:#ffffff;
    --texte:#2d2418; --texte-2:#7a6a55; --bord:#e8dfd2;
    --na:#c0392b; --eca:#e67e22; --a:#2e86c1; --m:#27ae60;
    --ombre:0 1px 4px rgba(60,40,10,.10);
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--creme); color:var(--texte); font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header.app{
    position:sticky; top:0; z-index:50; background:var(--brun); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  header.app h1{font-size:17px; margin:0; font-weight:700; flex:1; line-height:1.25;}
  header.app small{display:block; font-weight:400; opacity:.85; font-size:12px;}
  .btn-icone{
    background:rgba(255,255,255,.15); border:none; color:#fff; font-size:15px;
    border-radius:10px; padding:9px 12px; font-weight:600; cursor:pointer;
  }
  main{max-width:640px; margin:0 auto; padding:14px 14px 90px;}

  /* ---------- Écran liste ---------- */
  .carte{
    background:var(--carte); border:1px solid var(--bord); border-radius:var(--radius);
    box-shadow:var(--ombre); padding:14px; margin-bottom:12px;
  }
  .carte-eval{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .carte-eval .infos{flex:1; min-width:0;}
  .carte-eval .nom{font-weight:700; font-size:16px;}
  .carte-eval .meta{color:var(--texte-2); font-size:13px; margin-top:2px;}
  .pastille-note{
    min-width:52px; height:52px; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px;
    flex-shrink:0;
  }
  .pastille-note span{font-size:9px; font-weight:500; opacity:.9;}
  .vide{
    text-align:center; color:var(--texte-2); padding:44px 20px; font-size:15px;
  }
  .vide .picto{font-size:44px; margin-bottom:10px;}
  .btn-flottant{
    position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--brun); color:#fff; border:none; border-radius:28px;
    padding:15px 26px; font-size:16px; font-weight:700; box-shadow:0 4px 14px rgba(92,46,13,.4);
    cursor:pointer; z-index:40;
  }
  .barre-actions-liste{display:flex; gap:8px; margin-bottom:12px;}
  .btn-sec{
    flex:1; background:#fff; border:1px solid var(--bord); color:var(--brun);
    border-radius:10px; padding:10px; font-size:14px; font-weight:600; cursor:pointer;
  }

  /* ---------- Formulaire ---------- */
  .bloc-titre{
    background:var(--brun); color:#fff; border-radius:var(--radius) var(--radius) 0 0;
    padding:11px 14px; font-weight:700; font-size:14.5px;
  }
  .bloc{border:1px solid var(--bord); border-radius:var(--radius); background:var(--carte); box-shadow:var(--ombre); margin-bottom:14px; overflow:hidden;}
  .bloc-corps{padding:12px 14px;}
  label.champ{display:block; font-size:13px; font-weight:600; color:var(--texte-2); margin:10px 0 4px;}
  label.champ:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%; border:1px solid var(--bord); border-radius:10px; padding:11px 12px;
    font-size:16px; font-family:inherit; background:#fdfbf8; color:var(--texte);
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--brun); outline-offset:1px; border-color:var(--brun);}
  .jours{display:flex; gap:8px;}
  .jours .puce{
    flex:1; text-align:center; border:1.5px solid var(--bord); border-radius:10px;
    padding:11px 6px; font-size:15px; font-weight:600; cursor:pointer; background:#fdfbf8; color:var(--texte-2);
    user-select:none;
  }
  .jours .puce.actif{background:var(--brun); border-color:var(--brun); color:#fff;}

  /* ---------- Critères ---------- */
  .critere{border-top:1px solid var(--bord); padding:13px 14px;}
  .critere:first-of-type{border-top:none;}
  .critere .titre{font-weight:700; font-size:15px;}
  .critere .indicateur{color:var(--texte-2); font-size:13px; margin:3px 0 10px;}
  .notes{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .note-btn{
    border:1.5px solid var(--bord); background:#fdfbf8; border-radius:12px;
    padding:8px 2px 7px; text-align:center; font-weight:700; font-size:12.5px; cursor:pointer;
    color:var(--texte-2); transition:transform .06s;
    display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.1;
  }
  .note-btn .ico{font-size:22px; filter:grayscale(1); opacity:.55; transition:filter .1s,opacity .1s;}
  .note-btn[class*=sel-] .ico{filter:none; opacity:1;}
  .note-btn:active{transform:scale(.94);}
  .note-btn.sel-na{background:var(--na); border-color:var(--na); color:#fff;}
  .note-btn.sel-eca{background:var(--eca); border-color:var(--eca); color:#fff;}
  .note-btn.sel-a{background:var(--a); border-color:var(--a); color:#fff;}
  .note-btn.sel-m{background:var(--m); border-color:var(--m); color:#fff;}
  .obs-toggle{
    background:none; border:none; color:var(--brun); font-size:13px; font-weight:600;
    padding:8px 0 0; cursor:pointer;
  }
  .critere textarea{margin-top:8px; min-height:52px; font-size:14px;}

  /* ---------- Synthèse ---------- */
  .synthese-note{
    display:flex; align-items:center; gap:14px; margin-bottom:8px;
  }
  .grosse-note{
    font-size:40px; font-weight:800; color:var(--brun); line-height:1; white-space:nowrap;
  }
  .grosse-note small{font-size:16px; font-weight:600; color:var(--texte-2);}
  .detail-calcul{font-size:12.5px; color:var(--texte-2);}
  .niveaux{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;}
  .niveau-btn{
    border:1.5px solid var(--bord); background:#fdfbf8; border-radius:10px; padding:9px 6px;
    font-size:13.5px; font-weight:600; text-align:center; cursor:pointer; color:var(--texte-2);
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .niveau-btn .ico{font-size:18px; filter:grayscale(1); opacity:.55;}
  .niveau-btn.actif{background:var(--brun-fonce); border-color:var(--brun-fonce); color:#fff;}
  .niveau-btn.actif .ico{filter:none; opacity:1;}
  .ajuste{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .ajuste input{width:90px; text-align:center; font-weight:700;}

  .barre-form{
    position:fixed; bottom:0; left:0; right:0; z-index:45;
    background:#fff; border-top:1px solid var(--bord);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; max-width:640px; margin:0 auto;
  }
  @media (min-width:640px){ .barre-form{left:50%; transform:translateX(-50%); border-radius:14px 14px 0 0; border:1px solid var(--bord); border-bottom:none;} }
  .btn-principal{
    flex:2; background:var(--brun); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:16px; font-weight:700; cursor:pointer;
  }
  .btn-annexe{
    flex:1; background:#fff; color:var(--texte-2); border:1.5px solid var(--bord); border-radius:12px;
    padding:14px 8px; font-size:15px; font-weight:600; cursor:pointer;
  }
  .progression{
    position:sticky; top:calc(56px + env(safe-area-inset-top)); z-index:30;
    background:var(--creme); padding:8px 0 10px; margin-bottom:4px;
  }
  .progression .barre{height:7px; background:var(--bord); border-radius:4px; overflow:hidden;}
  .progression .rempli{height:100%; background:var(--m); border-radius:4px; transition:width .25s;}
  .progression .txt{font-size:12px; color:var(--texte-2); margin-top:4px; text-align:right;}

  .toast{
    position:fixed; bottom:calc(84px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--texte); color:#fff; padding:11px 20px; border-radius:24px; font-size:14px;
    z-index:100; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
  }
  .toast.visible{opacity:1;}
  .legende{font-size:12px; color:var(--texte-2); padding:0 2px 10px;}
  .legende b{font-weight:700;}
  .lg-na{color:var(--na);} .lg-eca{color:var(--eca);} .lg-a{color:var(--a);} .lg-m{color:var(--m);}

  /* ---------- Impression ---------- */
  #vue-impression{display:none;}
  @media print{
    body *{visibility:hidden;}
    #vue-impression, #vue-impression *{visibility:visible;}
    #vue-impression{
      display:block; position:absolute; top:0; left:0; width:100%;
      font-size:11px; color:#000; padding:6mm;
    }
    #vue-impression h2{font-size:15px; margin:0 0 2px;}
    #vue-impression h3{font-size:12px; margin:10px 0 4px; background:#eee; padding:4px 6px;}
    #vue-impression table{width:100%; border-collapse:collapse; margin-bottom:4px;}
    #vue-impression th, #vue-impression td{border:1px solid #999; padding:3px 5px; text-align:left; vertical-align:top;}
    #vue-impression th{background:#f2f2f2;}
    #vue-impression .centre{text-align:center; width:34px;}
    #vue-impression .sig{display:flex; gap:20px; margin-top:16px;}
    #vue-impression .sig div{flex:1; border:1px solid #999; height:56px; padding:4px; font-size:10px;}
  }
</style>
</head>
<body>

<header class="app">
  <button class="btn-icone" id="btn-retour" style="display:none" onclick="app.retourListe()">‹ Liste</button>
  <h1 id="titre-header">Évaluation TP<small>Session 1 — Rentrée &amp; Fondamentaux · BTM Pâtissier</small></h1>
</header>

<main id="contenu"></main>

<button class="btn-flottant" id="btn-nouveau" onclick="app.nouvelle()">＋ Nouvelle évaluation</button>

<div class="barre-form" id="barre-form" style="display:none">
  <button class="btn-annexe" onclick="app.imprimer()">🖨 PDF</button>
  <button class="btn-annexe" onclick="app.partager()">📤</button>
  <button class="btn-principal" onclick="app.sauvegarder(true)">💾 Enregistrer</button>
</div>

<div class="toast" id="toast"></div>
<div id="vue-impression"></div>

<script>
/* ================== DONNÉES DE LA GRILLE ================== */
const GRILLE = {
  titre: "SESSION 1 — SEPTEMBRE — ANNÉE 1",
  sousTitre: "Grille d'évaluation — TP « Rentrée & Fondamentaux »",
  reference: "BTM Pâtissier-Glacier-Chocolatier-Confiseur-Traiteur (RNCP 41998) — Domaine Professionnel, Bloc BC01/BC04",
  sections: [
    {
      id:"s1", ico:"🧼", titre:"Journée 1 — Hygiène, sécurité alimentaire & organisation (diagnostique)",
      criteres:[
        {id:"c1", titre:"Tenue professionnelle & hygiène", ind:"Tenue complète et propre, mains lavées/désinfectées, ongles courts, bijoux retirés"},
        {id:"c2", titre:"Marche en avant", ind:"Identifie et respecte les zones du laboratoire (réception, stockage, préparation, cuisson, finition)"},
        {id:"c3", titre:"Principes HACCP", ind:"Cite les grands principes (identification des dangers, points critiques, traçabilité) à l'oral"},
        {id:"c4", titre:"DLC / DLUO", ind:"Distingue correctement une DLC d'une DLUO et leurs implications"},
        {id:"c5", titre:"Organisation du poste de travail", ind:"Poste rangé, propre, matériel nettoyé avant/après utilisation (méthode 5S)"}
      ]
    },
    {
      id:"s2", ico:"🥐", titre:"Journée 1 — Techniques de base : pâtes (sablée, brisée, feuilletée rapide)",
      criteres:[
        {id:"c6", titre:"Pâte sablée — pesée & dosage", ind:"Respect des grammages de la fiche technique, pesée précise"},
        {id:"c7", titre:"Pâte sablée — texture", ind:"Pâte non travaillée, homogène, sans excès d'élasticité"},
        {id:"c8", titre:"Pâte brisée — sablage", ind:"Beurre resté froid, éclats visibles, sablage rapide et régulier"},
        {id:"c9", titre:"Pâte feuilletée rapide — tours", ind:"Tours réalisés correctement, repos respectés, pâte striée de beurre visible"},
        {id:"c10", titre:"Gestion du temps", ind:"Respect du minutage de la séquence après-midi (3h30)"}
      ]
    },
    {
      id:"s3", ico:"🥧", titre:"Journée 2 — Mise en œuvre : tarte, crumble & clafoutis (formative)",
      criteres:[
        {id:"c11", titre:"Fonçage de tarte", ind:"Épaisseur régulière (3 mm), pas de trous ni de surépaisseurs, bords nets"},
        {id:"c12", titre:"Crème d'amande", ind:"Texture crémeuse, dosage respecté, application régulière sur le fond de tarte"},
        {id:"c13", titre:"Dressage des fruits (tarte)", ind:"Disposition régulière et esthétique (rosace / éventail), quantité homogène"},
        {id:"c14", titre:"Cuisson de la tarte", ind:"Coloration dorée homogène, cuisson à cœur de la crème d'amande"},
        {id:"c15", titre:"Pâte à crumble", ind:"Texture grumeleuse irrégulière, non tassée, non travaillée en pâte homogène"},
        {id:"c16", titre:"Cuisson du crumble", ind:"Coloration dorée, croustillant obtenu, fruits fondants à cœur"},
        {id:"c17", titre:"Appareil à clafoutis", ind:"Appareil lisse, sans grumeaux, bien délayé"},
        {id:"c18", titre:"Cuisson du clafoutis", ind:"Prise correcte, encore légèrement tremblotant au centre à la sortie du four"}
      ]
    },
    {
      id:"s4", ico:"🤝", titre:"Savoir-être professionnel (transversal aux 2 journées)",
      criteres:[
        {id:"c19", titre:"Autonomie", ind:"Réalise les tâches sans sollicitation excessive du formateur"},
        {id:"c20", titre:"Respect des consignes et du temps", ind:"Suit la fiche technique et le minutage donné"},
        {id:"c21", titre:"Communication / travail en équipe", ind:"Échange de façon professionnelle avec les autres apprenants et le formateur"},
        {id:"c22", titre:"Nettoyage et rangement en fin de séance", ind:"Poste, matériel et laboratoire remis en état conforme"}
      ]
    }
  ]
};
const NIVEAUX = ["NA","ECA","A","M"];
const NIVEAUX_LONG = {NA:"Non acquis", ECA:"En cours d'acquisition", A:"Acquis", M:"Maîtrisé"};
const NIVEAUX_ICO = {NA:"❌", ECA:"⏳", A:"✅", M:"⭐"};
const POINTS = {NA:0, ECA:1, A:2, M:3};
const TOUS_CRITERES = GRILLE.sections.flatMap(s=>s.criteres);
const CLE_STOCKAGE = "evaluations_tp_session1";

/* ================== APPLICATION ================== */
const app = {
  courante: null,   // évaluation en cours d'édition
  ecran: "liste",

  charger(){ try{ return JSON.parse(localStorage.getItem(CLE_STOCKAGE)) || []; }catch(e){ return []; } },
  persister(liste){ localStorage.setItem(CLE_STOCKAGE, JSON.stringify(liste)); },

  /* ---------- Écran liste ---------- */
  retourListe(){
    if(this.ecran==="form") this.sauvegarder(false); // sauvegarde silencieuse
    this.ecran="liste"; this.courante=null; this.rendre();
  },

  nouvelle(){
    this.courante = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      apprenti:"", formateur: localStorage.getItem("dernier_formateur")||"",
      date: new Date().toISOString().slice(0,10),
      jours:{j1:false, j2:false},
      notes:{}, obs:{},
      noteManuelle:null, niveauGlobal:"", appreciation:"",
      creeLe: Date.now()
    };
    this.ecran="form"; this.rendre();
  },

  ouvrir(id){
    const e = this.charger().find(x=>x.id===id);
    if(!e) return;
    this.courante = JSON.parse(JSON.stringify(e));
    this.ecran="form"; this.rendre();
  },

  supprimer(id, ev){
    ev.stopPropagation();
    const e = this.charger().find(x=>x.id===id);
    if(!confirm("Supprimer l'évaluation de « "+(e?.apprenti||"sans nom")+" » ?")) return;
    this.persister(this.charger().filter(x=>x.id!==id));
    this.rendre(); this.toast("Évaluation supprimée");
  },

  dupliquer(id, ev){
    ev.stopPropagation();
    const e = this.charger().find(x=>x.id===id);
    if(!e) return;
    const copie = JSON.parse(JSON.stringify(e));
    copie.id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    copie.apprenti = ""; copie.notes={}; copie.obs={}; copie.noteManuelle=null;
    copie.niveauGlobal=""; copie.appreciation=""; copie.creeLe=Date.now();
    this.courante = copie; this.ecran="form"; this.rendre();
    this.toast("Nouvelle évaluation (même date/formateur)");
  },

  /* ---------- Calculs ---------- */
  calcul(e){
    const notees = TOUS_CRITERES.filter(c=>e.notes[c.id]);
    const pts = notees.reduce((s,c)=>s+POINTS[e.notes[c.id]],0);
    const max = notees.length*3;
    const note = max>0 ? Math.round((pts/max)*20*2)/2 : null; // arrondi au 0,5
    return {nb:notees.length, total:TOUS_CRITERES.length, note, pts, max};
  },
  niveauSuggere(note){
    if(note===null) return "";
    if(note<8) return "NA";
    if(note<12) return "ECA";
    if(note<16) return "A";
    return "M";
  },
  noteFinale(e){
    return e.noteManuelle!==null && e.noteManuelle!=="" ? Number(e.noteManuelle) : this.calcul(e).note;
  },
  couleurNote(n){
    if(n===null||isNaN(n)) return "#9aa0a6";
    if(n<8) return "var(--na)"; if(n<12) return "var(--eca)"; if(n<16) return "var(--a)"; return "var(--m)";
  },

  /* ---------- Rendu ---------- */
  rendre(){
    document.getElementById("btn-retour").style.display = this.ecran==="form" ? "" : "none";
    document.getElementById("btn-nouveau").style.display = this.ecran==="liste" ? "" : "none";
    document.getElementById("barre-form").style.display = this.ecran==="form" ? "flex" : "none";
    if(this.ecran==="liste") this.rendreListe(); else this.rendreForm();
    window.scrollTo(0,0);
  },

  rendreListe(){
    document.getElementById("titre-header").innerHTML =
      'Évaluation TP<small>Session 1 — Rentrée &amp; Fondamentaux · BTM Pâtissier</small>';
    const liste = this.charger().sort((a,b)=>b.creeLe-a.creeLe);
    const M = document.getElementById("contenu");
    if(liste.length===0){
      M.innerHTML = '<div class="vide"><div class="picto">🧑‍🍳</div>Aucune évaluation pour le moment.<br>Appuyez sur « Nouvelle évaluation » pour commencer.</div>';
      return;
    }
    let html = '<div class="barre-actions-liste"><button class="btn-sec" onclick="app.exportCSV()">⬇️ Exporter tout (CSV)</button></div>';
    for(const e of liste){
      const n = this.noteFinale(e);
      const c = this.calcul(e);
      html += `<div class="carte carte-eval" onclick="app.ouvrir('${e.id}')">
        <div class="pastille-note" style="background:${this.couleurNote(n)}">${n===null?"—":String(n).replace(".",",")}<span>/20</span></div>
        <div class="infos">
          <div class="nom">${this.echap(e.apprenti)||"<i>Sans nom</i>"}</div>
          <div class="meta">${this.dateFr(e.date)} · ${c.nb}/${c.total} critères${e.niveauGlobal?" · "+NIVEAUX_LONG[e.niveauGlobal]:""}</div>
        </div>
        <button class="btn-icone" style="background:#f1ece3;color:var(--brun)" title="Nouvel élève, même séance" onclick="app.dupliquer('${e.id}',event)">⧉</button>
        <button class="btn-icone" style="background:#fbeae8;color:var(--na)" onclick="app.supprimer('${e.id}',event)">✕</button>
      </div>`;
    }
    M.innerHTML = html;
  },

  rendreForm(){
    const e = this.courante;
    document.getElementById("titre-header").innerHTML =
      (this.echap(e.apprenti)||"Nouvelle évaluation")+'<small>'+GRILLE.titre+'</small>';
    const c = this.calcul(e);
    let html = `
    <div class="progression">
      <div class="barre"><div class="rempli" id="prog-rempli" style="width:${c.total?c.nb/c.total*100:0}%"></div></div>
      <div class="txt" id="prog-txt">${c.nb}/${c.total} critères évalués</div>
    </div>
    <div class="legende">❌ <b class="lg-na">NA</b> Non acquis · ⏳ <b class="lg-eca">ECA</b> En cours d'acquisition · ✅ <b class="lg-a">A</b> Acquis · ⭐ <b class="lg-m">M</b> Maîtrisé</div>

    <div class="bloc"><div class="bloc-titre">👤 Identification</div><div class="bloc-corps">
      <label class="champ">Apprenti(e)</label>
      <input type="text" id="f-apprenti" value="${this.attr(e.apprenti)}" placeholder="Nom de l'élève" autocomplete="off" oninput="app.maj('apprenti',this.value)">
      <label class="champ">Formateur</label>
      <input type="text" id="f-formateur" value="${this.attr(e.formateur)}" placeholder="Votre nom" autocomplete="off" oninput="app.maj('formateur',this.value)">
      <label class="champ">Date</label>
      <input type="date" value="${e.date}" oninput="app.maj('date',this.value)">
      <label class="champ">Journée(s) évaluée(s)</label>
      <div class="jours">
        <div class="puce ${e.jours.j1?"actif":""}" onclick="app.basculeJour('j1',this)">📅 Jour 1</div>
        <div class="puce ${e.jours.j2?"actif":""}" onclick="app.basculeJour('j2',this)">📅 Jour 2</div>
      </div>
    </div></div>`;

    for(const s of GRILLE.sections){
      html += `<div class="bloc"><div class="bloc-titre">${s.ico} ${s.titre}</div>`;
      for(const cr of s.criteres){
        const sel = e.notes[cr.id]||"";
        const obs = e.obs[cr.id]||"";
        html += `<div class="critere">
          <div class="titre">${cr.titre}</div>
          <div class="indicateur">${cr.ind}</div>
          <div class="notes">`+
          NIVEAUX.map(n=>`<button class="note-btn ${sel===n?"sel-"+n.toLowerCase():""}" onclick="app.noter('${cr.id}','${n}',this)"><span class="ico">${NIVEAUX_ICO[n]}</span>${n}</button>`).join("")+
          `</div>
          <button class="obs-toggle" onclick="app.toggleObs('${cr.id}',this)">${obs?"✏️ Observation":"💬 Ajouter une observation"}</button>
          <textarea id="obs-${cr.id}" style="display:${obs?"block":"none"}" placeholder="Observation…" oninput="app.majObs('${cr.id}',this.value)">${this.echap(obs)}</textarea>
        </div>`;
      }
      html += `</div>`;
    }

    const note = this.noteFinale(e);
    const sugg = this.niveauSuggere(this.calcul(e).note);
    html += `
    <div class="bloc"><div class="bloc-titre">📋 Synthèse de l'évaluation</div><div class="bloc-corps">
      <div class="synthese-note">
        <div class="grosse-note" id="syn-note" style="color:${this.couleurNote(note)}">${note===null?"—":String(note).replace(".",",")}<small> / 20</small></div>
        <div class="detail-calcul" id="syn-detail">${this.texteCalcul(e)}</div>
      </div>
      <div class="ajuste">
        <label style="font-size:13px;color:var(--texte-2);font-weight:600">Ajuster la note :</label>
        <input type="number" min="0" max="20" step="0.5" inputmode="decimal" value="${e.noteManuelle??""}" placeholder="auto" oninput="app.majNoteManuelle(this.value)">
        <button class="btn-sec" style="flex:0 0 auto;padding:8px 12px" onclick="app.majNoteManuelle('');this.parentNode.querySelector('input').value=''">Auto</button>
      </div>
      <label class="champ" style="margin-top:14px">Niveau global atteint ${sugg?`<span style="font-weight:400">(suggestion : ${NIVEAUX_LONG[sugg]})</span>`:""}</label>
      <div class="niveaux">`+
      NIVEAUX.map(n=>`<button class="niveau-btn ${e.niveauGlobal===n?"actif":""}" onclick="app.majNiveau('${n}',this)"><span class="ico">${NIVEAUX_ICO[n]}</span>${NIVEAUX_LONG[n]}</button>`).join("")+
      `</div>
      <label class="champ" style="margin-top:14px">Appréciation générale et axes de progrès</label>
      <textarea rows="4" placeholder="Points forts, points à travailler…" oninput="app.maj('appreciation',this.value)">${this.echap(e.appreciation)}</textarea>
    </div></div>`;

    document.getElementById("contenu").innerHTML = html;
  },

  /* ---------- Mutations ---------- */
  maj(champ, val){ this.courante[champ]=val; if(champ==="apprenti") this.majHeader(); },
  majHeader(){
    document.getElementById("titre-header").innerHTML =
      (this.echap(this.courante.apprenti)||"Nouvelle évaluation")+'<small>'+GRILLE.titre+'</small>';
  },
  basculeJour(j, el){
    this.courante.jours[j]=!this.courante.jours[j];
    el.classList.toggle("actif");
  },
  noter(cid, niveau, btn){
    const e=this.courante;
    if(e.notes[cid]===niveau){ delete e.notes[cid]; }
    else e.notes[cid]=niveau;
    const sel=e.notes[cid];
    const parent=btn.parentNode;
    [...parent.children].forEach((b,i)=>{ b.className="note-btn"+(sel===NIVEAUX[i]?" sel-"+NIVEAUX[i].toLowerCase():""); });
    this.majSynthese();
  },
  toggleObs(cid, btn){
    const ta=document.getElementById("obs-"+cid);
    const visible = ta.style.display!=="none";
    ta.style.display = visible?"none":"block";
    if(!visible) ta.focus();
  },
  majObs(cid,val){ if(val) this.courante.obs[cid]=val; else delete this.courante.obs[cid]; },
  majNoteManuelle(val){
    this.courante.noteManuelle = val===""?null:Math.max(0,Math.min(20,Number(val)));
    this.majSynthese();
  },
  majNiveau(n, btn){
    this.courante.niveauGlobal = this.courante.niveauGlobal===n ? "" : n;
    [...btn.parentNode.children].forEach((b,i)=>b.classList.toggle("actif", this.courante.niveauGlobal===NIVEAUX[i]));
  },
  majSynthese(){
    const e=this.courante, c=this.calcul(e), note=this.noteFinale(e);
    document.getElementById("prog-rempli").style.width=(c.total?c.nb/c.total*100:0)+"%";
    document.getElementById("prog-txt").textContent=c.nb+"/"+c.total+" critères évalués";
    const el=document.getElementById("syn-note");
    el.innerHTML=(note===null?"—":String(note).replace(".",","))+"<small> / 20</small>";
    el.style.color=this.couleurNote(note);
    document.getElementById("syn-detail").textContent=this.texteCalcul(e);
  },
  texteCalcul(e){
    const c=this.calcul(e);
    if(c.nb===0) return "Notez des critères pour calculer la note automatiquement (NA=0 · ECA=1 · A=2 · M=3 pts).";
    let t=`Calcul auto : ${c.pts}/${c.max} pts sur ${c.nb} critère${c.nb>1?"s":""} → ${String(c.note).replace(".",",")}/20`;
    if(e.noteManuelle!==null && e.noteManuelle!=="") t+=" (note ajustée manuellement)";
    return t;
  },

  /* ---------- Sauvegarde ---------- */
  sauvegarder(notifier){
    const e=this.courante;
    if(!e) return;
    if(e.formateur) localStorage.setItem("dernier_formateur", e.formateur);
    const liste=this.charger();
    const i=liste.findIndex(x=>x.id===e.id);
    if(i>=0) liste[i]=JSON.parse(JSON.stringify(e)); else liste.push(JSON.parse(JSON.stringify(e)));
    this.persister(liste);
    if(notifier) this.toast("💾 Évaluation enregistrée");
  },

  /* ---------- Export / partage ---------- */
  imprimer(){
    this.sauvegarder(false);
    document.getElementById("vue-impression").innerHTML=this.htmlImpression(this.courante);
    window.print();
  },
  htmlImpression(e){
    const c=this.calcul(e), note=this.noteFinale(e);
    let h=`<h2>${GRILLE.titre}</h2>
    <div><b>${GRILLE.sousTitre}</b></div>
    <div style="font-size:9px">${GRILLE.reference}</div>
    <table style="margin-top:6px"><tr>
      <th>Apprenti(e)</th><td>${this.echap(e.apprenti)}</td>
      <th>Date</th><td>${this.dateFr(e.date)}</td></tr>
    <tr><th>Formateur</th><td>${this.echap(e.formateur)}</td>
      <th>Journée(s)</th><td>${e.jours.j1?"☑":"☐"} Jour 1&nbsp;&nbsp;${e.jours.j2?"☑":"☐"} Jour 2</td></tr></table>
    <div style="font-size:9px;margin:4px 0">Légende — NA = Non acquis · ECA = En cours d'acquisition · A = Acquis · M = Maîtrisé</div>`;
    for(const s of GRILLE.sections){
      h+=`<h3>${s.titre}</h3><table><tr><th style="width:26%">Critère</th><th>Indicateurs</th>
        <th class="centre">NA</th><th class="centre">ECA</th><th class="centre">A</th><th class="centre">M</th><th style="width:20%">Observations</th></tr>`;
      for(const cr of s.criteres){
        const n=e.notes[cr.id]||"";
        h+=`<tr><td><b>${cr.titre}</b></td><td>${cr.ind}</td>`+
          NIVEAUX.map(x=>`<td class="centre">${n===x?"☑":"☐"}</td>`).join("")+
          `<td>${this.echap(e.obs[cr.id]||"")}</td></tr>`;
      }
      h+=`</table>`;
    }
    h+=`<h3>Synthèse de l'évaluation</h3>
    <table><tr><th style="width:30%">Note globale / 20</th><td><b style="font-size:14px">${note===null?"":String(note).replace(".",",")} / 20</b>
      ${c.nb?` <span style="font-size:9px">(${c.pts}/${c.max} pts, ${c.nb}/${c.total} critères)</span>`:""}</td></tr>
    <tr><th>Niveau global atteint</th><td>`+
      NIVEAUX.map(x=>`${e.niveauGlobal===x?"☑":"☐"} ${NIVEAUX_LONG[x]}`).join(" &nbsp; ")+
    `</td></tr>
    <tr><th>Appréciation générale<br>et axes de progrès</th><td style="height:44px">${this.echap(e.appreciation).replace(/\n/g,"<br>")}</td></tr></table>
    <div class="sig"><div>Signature du formateur</div><div>Signature de l'apprenti(e)</div></div>`;
    return h;
  },

  partager(){
    this.sauvegarder(false);
    const e=this.courante, note=this.noteFinale(e);
    let t=`${GRILLE.titre}\n${GRILLE.sousTitre}\n\nApprenti(e) : ${e.apprenti}\nFormateur : ${e.formateur}\nDate : ${this.dateFr(e.date)}\nJournée(s) : ${[e.jours.j1?"Jour 1":null,e.jours.j2?"Jour 2":null].filter(Boolean).join(" + ")||"—"}\n`;
    for(const s of GRILLE.sections){
      t+=`\n— ${s.titre} —\n`;
      for(const cr of s.criteres){
        t+=`• ${cr.titre} : ${e.notes[cr.id]?NIVEAUX_LONG[e.notes[cr.id]]:"non évalué"}`;
        if(e.obs[cr.id]) t+=` — ${e.obs[cr.id]}`;
        t+="\n";
      }
    }
    t+=`\nNOTE GLOBALE : ${note===null?"—":String(note).replace(".",",")}/20`;
    if(e.niveauGlobal) t+=`\nNiveau global : ${NIVEAUX_LONG[e.niveauGlobal]}`;
    if(e.appreciation) t+=`\n\nAppréciation : ${e.appreciation}`;
    if(navigator.share){ navigator.share({title:"Évaluation TP — "+e.apprenti, text:t}).catch(()=>{}); }
    else{ navigator.clipboard.writeText(t).then(()=>this.toast("📋 Copié dans le presse-papiers")); }
  },

  exportCSV(){
    const liste=this.charger();
    if(!liste.length){ this.toast("Aucune évaluation à exporter"); return; }
    const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const entetes=["Apprenti","Formateur","Date","Jour 1","Jour 2",
      ...TOUS_CRITERES.map(c=>c.titre), ...TOUS_CRITERES.map(c=>"Obs — "+c.titre),
      "Note /20","Niveau global","Appréciation"];
    const lignes=[entetes.map(esc).join(";")];
    for(const e of liste){
      const note=this.noteFinale(e);
      lignes.push([
        e.apprenti, e.formateur, e.date, e.jours.j1?"X":"", e.jours.j2?"X":"",
        ...TOUS_CRITERES.map(c=>e.notes[c.id]||""),
        ...TOUS_CRITERES.map(c=>e.obs[c.id]||""),
        note===null?"":String(note).replace(".",","), e.niveauGlobal?NIVEAUX_LONG[e.niveauGlobal]:"", e.appreciation
      ].map(esc).join(";"));
    }
    const blob=new Blob(["﻿"+lignes.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="evaluations_TP_session1.csv";
    a.click(); URL.revokeObjectURL(a.href);
    this.toast("⬇️ CSV téléchargé");
  },

  /* ---------- Utilitaires ---------- */
  echap(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); },
  attr(s){ return this.echap(s).replace(/"/g,"&quot;"); },
  dateFr(d){
    if(!d) return "—";
    const [a,m,j]=d.split("-");
    return j+"/"+m+"/"+a;
  },
  toast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg; t.classList.add("visible");
    clearTimeout(this._toastT);
    this._toastT=setTimeout(()=>t.classList.remove("visible"),2200);
  }
};

app.rendre();
</script>
</body>
</html>
